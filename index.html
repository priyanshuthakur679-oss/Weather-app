<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false" >
            <button><img src="54481.png" ></button>
        </div> 
        
        <div class="error">
            <p>City not found</p>
        </div>

        <div class="weather">
            <img src="12607703.png" class="weather-icon"> <br>  <br>
            <h1 class="temp">22
            °c</h1> 
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="whether.png" > 
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>   
                </div>
                <div class="col">
                    <img src="wind.png" > 
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>    
                </div>
                    
                
            </div>
           
        </div>

    </div>

<script src="script.js"></script>   
</body>    
</html>
